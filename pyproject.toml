[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-preflight"
version = "0.1.0"
description = "Pre-deploy smoke checks for any HTTP target: TLS expiry, redirect chain, security headers, cache policy, robots and sitemap. Fails CI before traffic does."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "khawajasafiullah18" }]
dependencies = []

[project.scripts]
deploy-preflight = "preflight.cli:main"

[tool.setuptools.packages.find]
include = ["preflight*"]
